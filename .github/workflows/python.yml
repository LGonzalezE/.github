name: Python

# Workflow reutilizable: instala dependencias y pasa los tests con pytest.
# Uso desde otro repo:
#   jobs:
#     tests:
#       uses: LGonzalezE/.github/.github/workflows/python.yml@main
#       with:
#         test-packages: pytest pytest-asyncio

on:
  workflow_call:
    inputs:
      working-directory:
        description: Carpeta del requirements.txt
        type: string
        default: .
      python-version:
        type: string
        default: '3.11'
      test-packages:
        description: Paquetes de test que no están en requirements.txt
        type: string
        default: pytest

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/requirements*.txt
      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi
          python -m pip install ${{ inputs.test-packages }}
      - name: Tests
        run: python -m pytest -q

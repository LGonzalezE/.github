name: npm

# Workflow reutilizable: instala, pasa lint y tests y compila un proyecto npm.
# Los scripts lint, test y build se ejecutan solo si existen en package.json.
# Uso desde otro repo:
#   jobs:
#     frontend:
#       uses: LGonzalezE/.github/.github/workflows/npm.yml@main
#       with:
#         working-directory: frontend

on:
  workflow_call:
    inputs:
      working-directory:
        description: Carpeta del package.json
        type: string
        default: .
      node-version:
        type: string
        default: '20'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Tests
        run: npm run test --if-present
      - name: Build
        run: npm run build --if-present
